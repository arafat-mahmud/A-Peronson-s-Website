name: OpenSearch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  opensearch-test:
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2
        options: --health-cmd="curl -s http://localhost:9200/_cluster/health || exit 1" --health-interval=10s --health-timeout=5s --health-retries=30 -e discovery.type=single-node -e OPENSEARCH_INITIAL_ADMIN_PASSWORD=${{ secrets.OPENSEARCH_PASSWORD }}
        ports:
          - 9200:9200

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm ci
      - name: Wait for OpenSearch
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:9200/_cluster/health | grep -q '"status"'; then
              echo "OpenSearch ready"
              break
            fi
            sleep 2
          done
      - name: Run tests
        run: npm test --silent
